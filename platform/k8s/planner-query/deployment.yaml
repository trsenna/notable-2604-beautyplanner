apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-query
  labels:
    app: planner-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planner-query
  template:
    metadata:
      labels:
        app: planner-query
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: planner-query
          image: ghcr.io/trsenna/notable-2604-beautyplanner/planner-query:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
