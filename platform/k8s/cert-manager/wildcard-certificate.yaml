apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: localhost-wildcard-cert
  namespace: cert-manager
spec:
  secretName: localhost-tls-secret
  issuerRef:
    name: beautyplanner-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: "*.localhost"
  dnsNames:
  - localhost
  - "*.localhost"
  - "planner.localhost"
  - "argocd.localhost"
