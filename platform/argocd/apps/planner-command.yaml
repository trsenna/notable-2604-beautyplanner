apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planner-command
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/trsenna/notable-2604-beautyplanner.git'
    targetRevision: main
    path: platform/k8s/planner-command
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: planner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
