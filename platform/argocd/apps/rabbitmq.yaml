apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planner-rabbitmq
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 16.0.14
    chart: rabbitmq
    helm:
      parameters:
        - name: global.security.allowInsecureImages
          value: "true"
        - name: image.repository
          value: "bitnamilegacy/rabbitmq"
        - name: image.tag
          value: "3.13.7"
        - name: auth.password
          value: "beautyplanner"
        - name: persistence.enabled
          value: "false"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
