apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planner-mongodb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 18.6.29
    chart: mongodb
    helm:
      values: |
        image:
          tag: latest
        auth:
          rootPassword: "beautyplanner"
        persistence:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
